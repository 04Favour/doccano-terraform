  # 2. BUILD & PUSH IMAGE
  build-and-push:
    # needs: [quality-gate] # Uncomment this once the first job is active
    runs-on: self-hosted
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with: 
          context: .
          file: ./docker/Dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doccano:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/doccano:latest
  # 3. DEPLOY TO PRODUCTION
  deploy:
    needs: [build-and-push]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure env variables are available for the compose file
          docker-compose pull
          docker-compose -f docker-compose.prod.yml --env-file .env up -d
          docker image prune -f